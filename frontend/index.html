<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F2ED" />
    <meta name="description" content="VELOCE // Formula 1 3D Scrollytelling, Realistic Circuit Simulation & ML Strategy Experience" />
    <title>VELOCE // F1 3D Scrollytelling, Realistic Circuit Simulation & ML Strategy</title>

    <!-- Google Fonts Preconnect & Subsets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-FOUC Base Styles -->
    <style>
      :root {
        --bg-editorial-stone: #F4F2ED;
        --bg-showroom-obsidian: #0B0C0E;
        --text-ink-primary: #0F1012;
        --text-alabaster: #F7F6F2;
        --text-titanium: #7A7E85;
        --accent-vermilion: #FF3B00;
        --accent-champagne: #D4AF37;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        background-color: var(--bg-editorial-stone);
        color: var(--text-ink-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background-color: transparent;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        position: relative;
      }

      /* Custom Range Sliders */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 9999px;
        background: rgba(122, 126, 133, 0.25);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #FF3B00;
        margin-top: -7px;
        box-shadow: 0 0 12px rgba(255, 59, 0, 0.5);
        transition: transform 0.15s ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.18);
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 9999px;
        background: rgba(122, 126, 133, 0.25);
      }
      input[type="range"]::-moz-range-thumb {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        border: none;
        background: #FF3B00;
        box-shadow: 0 0 12px rgba(255, 59, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="position: fixed; inset: 0; background-color: #0B0C0E; color: #FF3B00; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 2rem; z-index: 99999;">
        <h1>JavaScript is Required</h1>
        <p>Please enable JavaScript in your browser to view VELOCE 3D Simulation and Scrollytelling.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
